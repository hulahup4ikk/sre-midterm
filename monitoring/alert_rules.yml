groups:
  - name: taskflow_alerts
    rules:
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="taskflow_backend"}[5m])
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API is getting slow"
          description: "p95 latency is above 500ms for more than 2 minutes"

      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{job="taskflow_backend", status_code=~"5.."}[5m])
            /
            rate(http_requests_total{job="taskflow_backend"}[5m])
          ) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Error rate too high"
          description: "More than 5% of requests are failing with 5xx status codes"

      - alert: BackendDown
        expr: up{job="taskflow_backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "Prometheus cannot reach backend service"
